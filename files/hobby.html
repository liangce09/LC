<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" href="../img/lclogo(black)1.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的爱好</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
        }

        #head{
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 999;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            padding: 8px 30px;
        }
        #head ul{
            list-style-type: none;
            width: 750px;
            margin: 0;
            display: flex;
            align-items: center;
            padding: 0 10px;
        }
        #head .logo-img{
            width: 40px;
            vertical-align: middle;
        }
        #head li{
            width: 125px;
            text-align: center;
            font-size: 16px;
            line-height: 40px;
            white-space: nowrap;
        }
        #head a{
            text-decoration: none;
            color: #666;
            display: inline-block;
            transition: transform 0.85s ease, color 0.3s ease;
        }
        #head a.active {
            color: #000;
        }
        #head a:hover {
            transform: scale(1.10);
            color: #000;
        }

        /* 汉堡按钮：桌面端隐藏，移动端显示 */
        .nav-toggle{
            display: none;
            width: 38px;
            height: 38px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
        }
        .nav-toggle span{
            display: block;
            width: 22px;
            height: 2px;
            background: #333;
            transition: all 0.3s ease;
        }
        .nav-toggle.open span:nth-child(1){ transform: translateY(7px) rotate(45deg); }
        .nav-toggle.open span:nth-child(2){ opacity: 0; }
        .nav-toggle.open span:nth-child(3){ transform: translateY(-7px) rotate(-45deg); }
        /* 移动端抽屉菜单：遮罩 + 右侧滑入面板 */
        .nav-mask{
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }
        .nav-mask.show{ opacity: 1; pointer-events: auto; }
        .nav-drawer{
            position: fixed;
            top: 0;
            right: 0;
            width: 240px;
            height: 100vh;
            max-width: 80vw;
            background: #fff;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 1001;
            overflow-y: auto;
            box-shadow: -2px 0 12px rgba(0,0,0,0.08);
        }
        .nav-drawer.open{ transform: translateX(0); }
        /* 移动端顶部左侧LOGO：桌面端隐藏（#head 提高优先级，避免被 #head a 覆盖） */
        #head .head-logo{
            display: none;
            line-height: 0;
            text-decoration: none;
        }
        .nav-drawer ul{ list-style: none; margin: 0; padding: 10px 0 20px; display: block; width: auto; }
        .nav-drawer li{ margin: 0; width: auto; line-height: normal; }
        .nav-drawer li a{
            display: block;
            padding: 15px 24px;
            background: transparent;
            color: #333;
            font-size: 18px;
            font-weight: 400;
            letter-spacing: 1px;
            text-decoration: none;
            transform: none;
            transition: background 0.2s ease, color 0.2s ease;
        }
        /* 仅当前页高亮灰色 */
        .nav-drawer li a.active{ color: #000; background: #f0f0f0; font-weight: 600; }
        .nav-drawer li a:hover{ transform: none; color: #000; background: #f7f7f7; }

        @media (max-width: 768px) {
            #head{
                padding: 10px 15px !important;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            #head ul{
                display: none !important;
            }
            #head .head-logo{
                display: block;
            }
            #head .head-logo .logo-img{
                width: 32px;
            }
            .nav-toggle{
                display: flex;
            }
            #head a:hover {
                transform: scale(1);
            }
        }

        body{
            background-color: #f5f5f5;
            padding: 80px 20px 60px;
        }

        .hobby-title{
            font-size: 36px;
            color: #1a1a1a;
            text-align: center;
            margin-bottom: 50px;
            font-weight: 300;
        }

        /* 我去过的地方 - 地图（极简卡片风） */
        .map-section{
            max-width: 1400px;
            margin: 0 auto;
        }
        .map-sub{
            text-align: center;
            color: #888;
            font-size: 14px;
            margin: -30px 0 18px;
            letter-spacing: 1px;
        }
        .map-card{
            background: #fff;
            border: 1px solid #eee;
            border-radius: 4px;
            padding: 12px 14px 14px;
        }
        .map-card .map-tip{
            color: #aaa;
            font-size: 12px;
            margin-bottom: 10px;
            text-align: left;
        }
        .map-svg-wrapper{
            position: relative;
            width: 100%;
            background: #fafafa;
            border: 1px solid #eee;
            border-radius: 4px;
            overflow: hidden;
        }
        #map{
            width: 100%;
            height: calc(100vh - 300px);
            min-height: 480px;
            display: block;
        }

        /* 地图加载遮罩层 + 进度条 */
        .map-mask{
            position: absolute;
            inset: 0;
            background: #fafafa;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px 20px;
            opacity: 1;
            transition: opacity 0.6s ease;
            pointer-events: auto;
        }
        .map-mask.hide{
            opacity: 0;
            pointer-events: none;
        }
        .mask-title{
            font-size: 0.95rem;
            color: #222;
            font-weight: 400;
            letter-spacing: 3px;
            margin-bottom: 12px;
        }
        .mask-tip{
            font-size: 0.78rem;
            color: #888;
            line-height: 1.8;
            max-width: 420px;
            margin-bottom: 22px;
            letter-spacing: 1px;
        }
        .progress-bar-box{
            width: 260px;
            height: 2px;
            background: #e5e5e5;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .progress-inner{
            height: 100%;
            width: 0%;
            background: #222;
            transition: width 0.15s linear;
        }
        .progress-percent{
            font-size: 0.7rem;
            color: #aaa;
            letter-spacing: 2px;
        }
        @media (max-width: 768px){
            .progress-bar-box{ width: 70%; }
            #map{ height: 60vh; min-height: 380px; }
        }

        /* 图例（极简） */
        .legend{
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            align-items: center;
        }
        .legend-item{
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #777;
        }
        .legend-color{
            width: 12px;
            height: 12px;
            border: 1px solid #888;
        }
    </style>
</head>
<body>
    <div id="head">
        <!-- 移动端左侧LOGO（桌面端隐藏） -->
        <a href="../index.html" class="head-logo"><img class="logo-img" src="../img/lclogo(black)2.png" alt=""></a>
        <ul>
            <li><img class="logo-img" src="../img/lclogo(black)2.png" alt=""></li>
            <li><a href="../index.html">主页</a></li>
            <li><a href="../files/music.html">喜欢的音乐</a></li>
            <li><a href="../files/hobby.html" class="active">我的爱好</a></li>
            <li><a href="../files/game.html">游戏</a></li>
            <li><a href="../files/about.html">关于</a></li>
        </ul>
        <!-- 移动端汉堡按钮 -->
        <button class="nav-toggle" id="navToggle" aria-label="打开菜单">
            <span></span><span></span><span></span>
        </button>
    </div>
    <!-- 移动端抽屉菜单：遮罩 + 右侧滑入面板 -->
    <div class="nav-mask" id="navMask"></div>
    <nav class="nav-drawer" id="navDrawer">
        <ul>
            <li><a href="../index.html">主页</a></li>
            <li><a href="../files/music.html">喜欢的音乐</a></li>
            <li><a href="../files/hobby.html" class="active">我的爱好</a></li>
            <li><a href="../files/game.html">游戏</a></li>
            <li><a href="../files/about.html">关于</a></li>
        </ul>
    </nav>

    <section class="map-section">
        <h2 class="hobby-title">我去过的地方</h2>
        <p class="map-sub">足迹 · 11 座城市</p>
        <div class="map-card">
            <div class="map-tip">深色轮廓是我去过的城市</div>
            <div class="map-svg-wrapper">
                <div id="map"></div>
                <div id="mapMask" class="map-mask">
                    <div class="mask-title">地图加载中</div>
                    <div class="mask-tip">由于本地图使用高德 API，加载需要一定时间(需要联网查看)</div>
                    <div class="progress-bar-box">
                        <div id="progressBar" class="progress-inner"></div>
                    </div>
                    <div id="progressPercent" class="progress-percent">0%</div>
                </div>
            </div>
            <div class="legend">
                <div class="legend-item">
                    <span class="legend-color" style="background:rgba(26,26,26,0.85); width:8px; height:8px; border:none;"></span>
                    <span>我去过的城市</span>
                </div>
            </div>
        </div>
    </section>

    <script>
        // 高德地图安全密钥（必须在加载 JS API 之前设置）
        window._AMapSecurityConfig = {
            securityJsCode: "0c12f3a85c68fdd7758c7399aed32e53"
        };
    </script>
    <script src="https://webapi.amap.com/maps?v=2.0&key=4c5dfadbd951c78ed1f89af63a153891&plugin=AMap.DistrictSearch"></script>
    <script>
        var map = null;
        var allPolygons = [];       // 所有多边形，加载完成后自适应视野

        // 我去过的城市（adcode 与高德行政区划一致，用编码检索更稳定）
        var visitedCities = [
            { key: 'guangzhou', name: '广州', adcode: '440100' },
            { key: 'shenzhen',  name: '深圳', adcode: '440300' },
            { key: 'dongguan',  name: '东莞', adcode: '441900' },
            { key: 'pingxiang', name: '萍乡', adcode: '360300' },
            { key: 'jian',      name: '吉安', adcode: '360800' },
            { key: 'hangzhou',  name: '杭州', adcode: '330100' },
            { key: 'shanghai',  name: '上海', adcode: '310000' },
            { key: 'nanjing',   name: '南京', adcode: '320100' },
            { key: 'suzhou',    name: '苏州', adcode: '320500' },
            { key: 'changzhou', name: '常州', adcode: '320400' },
            { key: 'yinchuan',  name: '银川', adcode: '640100' }
        ];

        // 绘制城市轮廓（深色高亮）+ 城市名标签
        function drawCityBoundary(city, district) {
            (district.boundaries || []).forEach(function (path) {
                if (!path || !path.length) return;
                var polygon = new AMap.Polygon({
                    path: path,
                    strokeWeight: 2.5,
                    strokeColor: '#111111',
                    strokeOpacity: 0.9,
                    fillColor: '#1a1a1a',
                    fillOpacity: 0.32,
                    zIndex: 200,
                    bubble: true
                });
                polygon.setMap(map);
                allPolygons.push(polygon);
            });

            var center = district.center;
            if (center) {
                var lng = (typeof center.getLng === 'function') ? center.getLng() : (center.lng || center[0]);
                var lat = (typeof center.getLat === 'function') ? center.getLat() : (center.lat || center[1]);
                if (lng && lat) {
                    new AMap.Marker({
                        position: [lng, lat],
                        content: '<div style="pointer-events:none;color:#000;font-size:13px;font-weight:600;letter-spacing:2px;white-space:nowrap;text-shadow:0 0 4px rgba(255,255,255,0.9),0 0 4px rgba(255,255,255,0.9);">' + city.name + '</div>',
                        offset: [-14, -8],
                        zIndex: 300,
                        map: map
                    });
                }
            }
        }

        // 串行加载城市边界：独立 DistrictSearch 实例 + 250ms 间隔 + 3 次指数退避重试
        // （与参考地图 map.html 完全一致的可靠加载方式）
        function loadCityBoundaries(onDone) {
            var results = {};   // key -> district
            var idx = 0;

            function fetchOne(city, attempt, cb) {
                var ds = new AMap.DistrictSearch({
                    level: 'city',
                    subdistrict: 0,
                    extensions: 'all'
                });
                ds.search(city.adcode, function (status, result) {
                    var ok = (status === 'complete' && result && result.districtList &&
                              result.districtList[0] && result.districtList[0].boundaries &&
                              result.districtList[0].boundaries.length > 0);
                    if (ok) {
                        cb(null, result.districtList[0]);
                    } else if (attempt < 3) {
                        // 指数退避：250ms / 500ms / 1000ms
                        setTimeout(function () { fetchOne(city, attempt + 1, cb); }, 250 * Math.pow(2, attempt));
                    } else {
                        cb(new Error(city.name + ' 边界检索失败'), null);
                    }
                });
            }

            function nextCity() {
                if (idx >= visitedCities.length) {
                    // 全部完成后统一绘制轮廓与标签
                    visitedCities.forEach(function (c) {
                        if (results[c.key]) drawCityBoundary(c, results[c.key]);
                        else console.warn('城市轮廓获取失败：' + c.name);
                    });
                    if (typeof onDone === 'function') onDone();
                    return;
                }
                var city = visitedCities[idx++];
                fetchOne(city, 0, function (err, district) {
                    if (!err && district) results[city.key] = district;
                    // 间隔 250ms 再请求下一个，避免触发 QPS 限流
                    setTimeout(nextCity, 250);
                });
            }

            nextCity();
        }

        function initAmap() {
            if (typeof AMap === 'undefined') {
                document.getElementById('map').innerHTML =
                    '<p style="padding-top:240px;text-align:center;color:#999;">地图加载失败，请检查网络或高德 Key 配置</p>';
                return;
            }

            map = new AMap.Map('map', {
                zoom: 5,
                center: [114.2, 31.2],
                viewMode: '2D',
                mapStyle: 'amap://styles/whitesmoke',
                features: ['bg', 'road']
            });

            loadCityBoundaries(function () {
                // 加载完成后整体适配一次，让所有城市刚好充满视野
                if (allPolygons.length) {
                    map.setFitView(allPolygons, false, [60, 60, 60, 60]);
                }
            });
        }

        // ============ 加载进度条（遮罩 3.5~4.8 秒后淡出） ============
        function startProgressMask() {
            var mask = document.getElementById('mapMask');
            var bar = document.getElementById('progressBar');
            var txt = document.getElementById('progressPercent');
            if (!mask || !bar || !txt) return;

            var MIN_MS = 3500;   // 最短持续时间（毫秒）
            var MAX_MS = 4800;   // 最长持续时间（毫秒）
            var totalMs = MIN_MS + Math.floor(Math.random() * (MAX_MS - MIN_MS + 1));
            var tickMs = 50;
            var totalTicks = Math.ceil(totalMs / tickMs);
            var tick = 0;

            var timer = setInterval(function () {
                tick += 1;
                var pct = Math.min(100, Math.round((tick / totalTicks) * 100));
                bar.style.width = pct + '%';
                txt.textContent = pct + '%';
                if (tick >= totalTicks) {
                    clearInterval(timer);
                    bar.style.width = '100%';
                    txt.textContent = '100%';
                    // 略微延迟后淡出遮罩层，体验更顺滑
                    setTimeout(function () {
                        mask.classList.add('hide');
                        setTimeout(function () {
                            if (mask.parentNode) mask.parentNode.removeChild(mask);
                        }, 700);
                    }, 120);
                }
            }, tickMs);
        }

        function safeInit() {
            if (typeof AMap === 'undefined') {
                var tryInit = setInterval(function () {
                    if (typeof AMap !== 'undefined') {
                        clearInterval(tryInit);
                        initAmap();
                    }
                }, 200);
                setTimeout(function () { clearInterval(tryInit); }, 15000);
            } else {
                initAmap();
            }
        }

        startProgressMask();
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            setTimeout(safeInit, 0);
        } else {
            window.addEventListener('DOMContentLoaded', safeInit);
        }

        // 移动端抽屉菜单开关
        var navToggle = document.getElementById('navToggle');
        var navDrawer = document.getElementById('navDrawer');
        var navMask = document.getElementById('navMask');
        function setDrawer(open) {
            navDrawer.classList.toggle('open', open);
            navMask.classList.toggle('show', open);
            navToggle.classList.toggle('open', open);
            document.body.style.overflow = open ? 'hidden' : '';
        }
        navToggle.addEventListener('click', function () {
            setDrawer(!navDrawer.classList.contains('open'));
        });
        navMask.addEventListener('click', function () { setDrawer(false); });
        navDrawer.querySelectorAll('a').forEach(function (a) {
            a.addEventListener('click', function () { setDrawer(false); });
        });
    </script>
</body>
</html>
