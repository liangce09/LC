<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" href="img/lclogo(black)1.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我喜欢的音乐</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"微软雅黑",sans-serif}
        #head{position:fixed;top:0;left:0;width:100%;z-index:999;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.1);padding:8px 30px}
        #head ul{list-style:none;width:750px;display:flex;align-items:center;padding:0 10px}
        #head .logo-img{width:40px;vertical-align:middle}
        #head li{width:125px;text-align:center;font-size:16px;line-height:40px;white-space:nowrap}
        #head a{text-decoration:none;color:#666;display:inline-block;transition:transform .85s ease,color .3s ease}
        #head a.active{color:#000}
        #head a:hover{transform:scale(1.1);color:#000}
        /* 汉堡按钮：桌面端隐藏，移动端显示 */
        .nav-toggle{display:none;width:38px;height:38px;flex-direction:column;justify-content:center;align-items:center;gap:5px;background:none;border:none;cursor:pointer;padding:0}
        .nav-toggle span{display:block;width:22px;height:2px;background:#333;transition:all .3s ease}
        .nav-toggle.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
        .nav-toggle.open span:nth-child(2){opacity:0}
        .nav-toggle.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
        /* 移动端抽屉菜单：遮罩 + 右侧滑入面板 */
        .nav-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s ease;z-index:1000}
        .nav-mask.show{opacity:1;pointer-events:auto}
        .nav-drawer{position:fixed;top:0;right:0;width:240px;height:100vh;max-width:80vw;background:#fff;transform:translateX(100%);transition:transform .3s ease;z-index:1001;overflow-y:auto;box-shadow:-2px 0 12px rgba(0,0,0,.08)}
        .nav-drawer.open{transform:translateX(0)}
        /* 移动端顶部左侧LOGO：桌面端隐藏（#head 提高优先级，避免被 #head a 覆盖） */
        #head .head-logo{display:none;line-height:0;text-decoration:none}
        .nav-drawer ul{list-style:none;margin:0;padding:10px 0 20px;display:block;width:auto}
        .nav-drawer li{margin:0;width:auto;line-height:normal}
        .nav-drawer li a{display:block;padding:15px 24px;background:transparent;color:#333;font-size:18px;font-weight:400;letter-spacing:1px;text-decoration:none;transform:none;transition:background .2s ease,color .2s ease}
        /* 仅当前页高亮灰色 */
        .nav-drawer li a.active{color:#000;background:#f0f0f0;font-weight:600}
        .nav-drawer li a:hover{transform:none;color:#000;background:#f7f7f7}
        @media (max-width:768px){
            #head{padding:10px 15px;display:flex;justify-content:space-between;align-items:center}
            #head ul{display:none}
            #head .head-logo{display:block}
            #head .head-logo .logo-img{width:32px}
            .nav-toggle{display:flex}
            #head a:hover{transform:scale(1)}
        }
        body{background:#f7f7f7;padding:100px 20px 40px}

        /* 背景层：播放时显示当前封面高斯模糊，未播放时所有封面 45° 斜向循环滚动 */
        .bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#f7f7f7}
        .bg-current{position:absolute;inset:-10%;background-size:cover;background-position:center;filter:blur(20px) brightness(.96);transform:scale(1.1);opacity:0;transition:opacity .8s ease}
        body.playing .bg-current{opacity:1}
        .bg-marquee{position:absolute;top:50%;left:50%;width:220vmax;height:220vmax;transform:translate(-50%,-50%) rotate(45deg);display:flex;flex-direction:column;justify-content:center;gap:26px;filter:blur(10px);transition:opacity .8s ease}
        body.playing .bg-marquee{opacity:0}
        .m-row{display:flex;width:max-content;animation:slide 90s linear infinite}
        .m-row:nth-child(even){animation-direction:reverse;animation-duration:110s}
        .m-row img{width:170px;height:170px;object-fit:cover;margin-right:26px;flex-shrink:0}
        @keyframes slide{to{transform:translateX(-50%)}}
        /* 半透明纱罩：保证背景模糊后前景文字仍清晰 */
        .bg-veil{position:absolute;inset:0;background:rgba(247,247,247,.5);transition:background .8s ease}
        body.playing .bg-veil{background:rgba(247,247,247,.4)}

        /* 页面标题区 */
        .page-head{max-width:1100px;margin:20px auto 36px;text-align:center;position:relative;z-index:1}
        .page-head h1{font-size:34px;font-weight:600;color:#222;letter-spacing:4px}
        .page-head p{color:#999;font-size:14px;margin-top:12px;letter-spacing:1px}

        /* 主布局：左边正在播放 + 右边播放列表 */
        .player-wrap{max-width:1100px;margin:0 auto;display:flex;gap:24px;align-items:flex-start;position:relative;z-index:1}
        @media (max-width:960px){.player-wrap{flex-direction:column}}

        /* 正在播放卡片 */
        .now-playing{flex:1;min-width:0;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.1);padding:36px 30px;display:flex;flex-direction:column;align-items:center}
        .cover-box{width:100%;max-width:460px;aspect-ratio:1/1;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.18)}
        .cover-box img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s ease}
        body.playing .cover-box img{transform:scale(1.05)}
        .np-title{margin-top:26px;font-size:24px;font-weight:600;color:#222;text-align:center;line-height:1.4}
        .np-artist{margin-top:8px;font-size:14px;color:#999;letter-spacing:1px}

        /* 进度条与音量 */
        .progress-row{width:100%;max-width:460px;display:flex;align-items:center;gap:12px;margin-top:28px;font-size:12px;color:#999}
        .vol-row{width:100%;max-width:460px;display:flex;align-items:center;gap:10px;margin-top:16px}
        input[type=range]{-webkit-appearance:none;appearance:none;height:4px;background:#e5e5e5;border-radius:2px;outline:none;cursor:pointer}
        .progress-row input{flex:1}
        .vol-row input{flex:1}
        input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#111;border:none;cursor:pointer}
        input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#111;border:none;cursor:pointer}

        /* 控制按钮 */
        .controls{display:flex;align-items:center;gap:20px;margin-top:26px}
        .ctrl-btn{width:42px;height:42px;border:none;background:none;cursor:pointer;color:#444;display:flex;align-items:center;justify-content:center;position:relative;transition:transform .2s ease,color .2s ease}
        .ctrl-btn svg{width:24px;height:24px;fill:currentColor}
        .ctrl-btn:hover{transform:scale(1.15);color:#000}
        .ctrl-btn.off{color:#c5c5c5}
        .ctrl-btn.on{color:#000}
        .ctrl-btn .badge{position:absolute;top:2px;right:2px;font-size:9px;background:#111;color:#fff;width:13px;height:13px;border-radius:50%;display:flex;align-items:center;justify-content:center}
        .play-btn{width:66px;height:66px;border-radius:50%;border:none;background:#111;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s ease}
        .play-btn svg{width:30px;height:30px;fill:currentColor}
        .play-btn:hover{transform:scale(1.08)}
        .vol-icon{width:22px;height:22px;fill:#444;cursor:pointer;flex-shrink:0}

        /* ===== 首次未播放状态：封面网格横向铺满全屏，播放器固定为底部迷你条 ===== */
        body.initial{padding-bottom:120px}
        body.initial .player-wrap{display:block;max-width:none;padding:0 40px}
        body.initial .playlist-box{width:100%;max-width:none;background:none;box-shadow:none;padding:0}
        body.initial .playlist-box h3{display:none}
        body.initial #playlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:26px;max-height:none;overflow:visible}
        body.initial .track{flex-direction:column;align-items:stretch;gap:0;padding:0 0 14px;overflow:hidden;transition:transform .3s ease,box-shadow .3s ease}
        body.initial .track:hover{background:#fff;transform:translateY(-6px);box-shadow:0 12px 26px rgba(0,0,0,.16)}
        body.initial .track.active{background:#fff;color:#222}
        body.initial .track.active .t-artist{color:#999}
        body.initial .track.active .t-dur{color:#666}
        body.initial .track img{width:100%;height:auto;aspect-ratio:1/1}
        body.initial .track .idx{position:absolute;top:12px;left:12px;z-index:2;width:auto;background:rgba(255,255,255,.9);color:#333;font-size:11px;padding:3px 9px}
        body.initial .track .eq{position:absolute;top:12px;left:12px;z-index:2;background:rgba(0,0,0,.6);padding:6px 9px}
        body.initial .t-info{padding:12px 14px 0}
        body.initial .t-dur{padding:0 14px;margin-top:8px}
        /* 底部迷你播放条 */
        body.initial .now-playing{position:fixed;bottom:0;left:0;right:0;z-index:998;flex-direction:row;align-items:center;gap:14px;padding:10px 24px;box-shadow:0 -2px 12px rgba(0,0,0,.12)}
        body.initial .cover-box{width:52px;max-width:none;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.15)}
        body.initial .np-title{margin:0;font-size:14px;text-align:left;line-height:1.3;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
        body.initial .np-artist{margin:0;font-size:12px;white-space:nowrap;flex-shrink:0}
        body.initial .np-artist::before{content:'- '}
        body.initial .progress-row{flex:1;min-width:0;margin-top:0;max-width:none}
        body.initial .controls{margin-top:0;gap:8px;flex-shrink:0}
        body.initial .ctrl-btn{width:34px;height:34px}
        body.initial .ctrl-btn svg{width:18px;height:18px}
        body.initial .play-btn{width:44px;height:44px}
        body.initial .play-btn svg{width:20px;height:20px}
        body.initial .vol-row{display:none}
        @media (max-width:640px){
            body.initial .player-wrap{padding:0 16px}
            body.initial #playlist{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
            body.initial .ctrl-btn{display:none}
            body.initial .np-artist{display:none}
            body.initial .np-title{max-width:130px;font-size:13px}
            body.initial .cover-box{width:44px}
            body.initial .play-btn{width:40px;height:40px}
        }

        /* ===== 首次点播后：播放器整屏居中，播放列表移到其下方 ===== */
        body.started .player-wrap{display:block;max-width:none;padding:0}
        body.started .now-playing{width:100%;min-height:calc(100vh - 90px);background:transparent;box-shadow:none;padding:70px 20px 40px;justify-content:center}
        body.started .cover-box{max-width:500px}
        body.started .progress-row{max-width:520px}
        body.started .playlist-box{width:100%;max-width:760px;margin:0 auto 70px}
        @media (max-width:640px){
            body.started .cover-box{max-width:300px}
        }

        /* 切换动画：播放器淡入，封面由被点击卡片的位置放大到全屏（JS FLIP），列表从右侧滑入 */
        body.started .now-playing{animation:playerFade .7s ease both}
        body.started .playlist-box{animation:listSlide .8s cubic-bezier(.22,1,.36,1) both}
        @keyframes playerFade{from{opacity:0}to{opacity:1}}
        @keyframes listSlide{from{opacity:0;transform:translateX(70px)}to{opacity:1;transform:none}}

        /* 播放列表 */
        .playlist-box{width:400px;flex-shrink:0;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.1);padding:22px 18px}
        @media (max-width:960px){.playlist-box{width:100%}}
        .playlist-box h3{font-size:16px;color:#333;padding:0 8px 14px;font-weight:600}
        .playlist-box h3 span{font-size:12px;color:#999;font-weight:400;margin-left:8px}
        #playlist{list-style:none;max-height:600px;overflow-y:auto}
        @media (max-width:960px){#playlist{max-height:420px}}
        #playlist::-webkit-scrollbar{width:6px}
        #playlist::-webkit-scrollbar-thumb{background:#ddd;border-radius:3px}
        .track{display:flex;align-items:center;gap:12px;padding:10px 8px;cursor:pointer;transition:background .2s ease;position:relative}
        .track:hover{background:#f2f2f2}
        .track.active{background:#111;color:#fff}
        .track.active:hover{background:#000}
        .track .idx{width:22px;text-align:center;font-size:12px;color:#999;flex-shrink:0}
        .track.active .idx{color:#888}
        .track img{width:44px;height:44px;object-fit:cover;flex-shrink:0}
        .t-info{flex:1;min-width:0}
        .t-title{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .t-artist{font-size:12px;color:#999;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .track.active .t-artist{color:#bbb}
        .t-dur{font-size:12px;color:#999;flex-shrink:0}
        .track.active .t-dur{color:#888}

        /* 正在播放的行：跳动均衡器动画 */
        .eq{display:none;align-items:flex-end;height:12px;gap:2px;width:22px;justify-content:center}
        .track.active .eq{display:inline-flex}
        .track.active .idx{display:none}
        .eq span{width:3px;background:currentColor;transform-origin:bottom;animation:eqb .9s ease-in-out infinite}
        .eq span:nth-child(1){height:5px;animation-delay:-.3s}
        .eq span:nth-child(2){height:11px;animation-delay:-.6s}
        .eq span:nth-child(3){height:8px}
        body:not(.playing) .eq span{animation-play-state:paused}
        @keyframes eqb{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}

        /* 底部文字 */
        .texta1{max-width:600px;margin:90px auto 10px;text-align:center;line-height:1.8;color:#444;font-size:11px;position:relative;z-index:1}
        .texta1 img{width:25px;margin-left:6px;vertical-align:middle}
    </style>
</head>
<body class="initial">

    <div class="player-wrap">
        <!-- 正在播放 -->
        <section class="now-playing">
            <div class="cover-box"><img id="cover" src="../img/muscover.jpg" alt="专辑封面"></div>
            <h2 class="np-title" id="npTitle">未在播放</h2>
            <p class="np-artist" id="npArtist">从右侧列表选择一首歌开始</p>

            <div class="progress-row">
                <span id="curTime">0:00</span>
                <input type="range" id="prog" min="0" max="100" step="0.1" value="0">
                <span id="durTime">0:00</span>
            </div>

            <div class="controls">
                <button class="ctrl-btn off" id="shuffleBtn" title="随机播放">
                    <svg viewBox="0 0 24 24"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
                </button>
                <button class="ctrl-btn" id="prevBtn" title="上一首">
                    <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6L18 6v12z"/></svg>
                </button>
                <button class="play-btn" id="playBtn" title="播放/暂停">
                    <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button class="ctrl-btn" id="nextBtn" title="下一首">
                    <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
                </button>
                <button class="ctrl-btn on" id="repeatBtn" title="播放模式">
                    <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                    <span class="badge" id="repeatBadge" style="display:none">1</span>
                </button>
            </div>

            <div class="vol-row">
                <svg class="vol-icon" viewBox="0 0 24 24" id="volBtn"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                <input type="range" id="vol" min="0" max="100" value="80">

        <!-- 播放列表 -->
        <section class="playlist-box">
            <h3>播放列表<span id="count"></span></h3>
            <ul id="playlist"></ul>
        </section>

<script>
// 音乐数据：music 文件夹内全部曲目（好不容易没有封面图，用 muscover.jpg 兜底）
const BASE = '../music/';
const FALLBACK_COVER = '../img/muscover.jpg';
const tracks = [
    {title:'Love Song', artist:'方大同', src:'Love Song - 方大同.aac', cover:'Love Song - 方大同.jpg'},
    {title:'Susan说', artist:'陶喆', src:'Susan说 - 陶喆.mp3', cover:'Susan说 - 陶喆.jpg'},
    {title:'The Secret of The Golden Bricks', artist:'方大同', src:'The Secret of The Golden Bricks - 方大同.mp3', cover:'The Secret of The Golden Bricks - 方大同.jpg'},
    {title:'七里香', artist:'周杰伦', src:'七里香 - 周杰伦.mp3', cover:'七里香 - 周杰伦.jpg'},
    {title:'为你写的歌', artist:'方大同', src:'为你写的歌 - 方大同.aac', cover:'为你写的歌 - 方大同.jpg'},
    {title:'兰亭序', artist:'周杰伦', src:'兰亭序 - 周杰伦.mp3', cover:'兰亭序 - 周杰伦.jpg'},
    {title:'因为你', artist:'方大同', src:'因为你 - 方大同.aac', cover:'因为你 - 方大同.jpg'},
    {title:'好不容易', artist:'方大同', src:'好不容易 - 方大同.mp3', cover:null},
    {title:'月亮代表谁的心', artist:'陶喆', src:'月亮代表谁的心 - 陶喆.mp3', cover:'月亮代表谁的心 - 陶喆.jpg'},
    {title:'枫叶做的风铃', artist:'方大同', src:'枫叶做的风铃 - 方大同.aac', cover:'枫叶做的风铃 - 方大同.jpg'},
    {title:'水之湄', artist:'惘闻', src:'水之湄 - 惘闻.mp3', cover:'水之湄 - 惘闻.jpg'},
    {title:'江南', artist:'林俊杰', src:'江南 - 林俊杰.mp3', cover:'江南 - 林俊杰.jpg'},
    {title:'爱在西元前', artist:'周杰伦', src:'爱在西元前 - 周杰伦.mp3', cover:'爱在西元前 - 周杰伦.jpg'},
    {title:'爱立刻', artist:'方大同', src:'爱立刻 - 方大同.mp3', cover:'爱立刻 - 方大同.jpg'},
    {title:'红豆', artist:'方大同', src:'红豆 - 方大同.mp3', cover:'红豆 - 方大同.jpg'},
    {title:'西界', artist:'林俊杰', src:'西界 - 林俊杰.mp3', cover:'西界 - 林俊杰.jpg'},
    {title:'退后', artist:'周杰伦', src:'退后 - 周杰伦.mp3', cover:'退后 - 周杰伦.jpg'}
];

// 元素引用
const audio = new Audio();
audio.volume = .8;
let cur = 0;                 // 当前曲目下标
let playing = false;         // 是否正在播放
let shuffle = false;         // 随机播放
let mode = 'loop';           // 播放模式：loop 列表循环 / one 单曲循环 / order 顺序播放
let seeking = false;         // 是否正在拖动进度条

const $ = id => document.getElementById(id);
const coverImg=$('cover'), npTitle=$('npTitle'), npArtist=$('npArtist');
const prog=$('prog'), curTime=$('curTime'), durTime=$('durTime');
const playBtn=$('playBtn'), playIcon=$('playIcon'), prevBtn=$('prevBtn'), nextBtn=$('nextBtn');
const shuffleBtn=$('shuffleBtn'), repeatBtn=$('repeatBtn'), repeatBadge=$('repeatBadge');
const vol=$('vol'), volBtn=$('volBtn'), listEl=$('playlist');
const bgMarquee=$('bgMarquee'), bgCurrent=$('bgCurrent');

// 生成背景斜向滚动的封面：每行把全部封面复制两份，配合位移 -50% 实现无缝循环
for(let r=0; r<24; r++){
    const row = document.createElement('div');
    row.className = 'm-row';
    for(let k=0; k<2; k++){
        tracks.forEach(t=>{
            const im = document.createElement('img');
            im.src = t.cover ? encodeURI(BASE + t.cover) : FALLBACK_COVER;
            im.alt = '';
            row.appendChild(im);
        });
    }
    bgMarquee.appendChild(row);
}

// 时间格式化：秒 → m:ss
function fmt(s){
    if(!isFinite(s)) return '--:--';
    const m = Math.floor(s/60), ss = Math.floor(s%60);
    return m + ':' + (ss<10?'0':'') + ss;
}

// range 滑块左侧填充色
function fillRange(el){
    const min=+el.min, max=+el.max;
    const p = max>min ? ((el.value-min)/(max-min))*100 : 0;
    el.style.background = `linear-gradient(to right,#111 ${p}%,#e5e5e5 ${p}%)`;
}

// 生成播放列表 DOM
tracks.forEach((t,i)=>{
    const li = document.createElement('li');
    li.className = 'track';
    li.innerHTML = `
        <span class="idx">${i+1}</span>
        <span class="eq"><span></span><span></span><span></span></span>
        <img src="${t.cover?encodeURI(BASE+t.cover):FALLBACK_COVER}" alt="" loading="lazy">
        <div class="t-info">
            <div class="t-title">${t.title}</div>
            <div class="t-artist">${t.artist}</div>
        </div>
        <span class="t-dur">--:--</span>`;
    // 点击行为：点当前曲 = 播放/暂停，点其他曲 = 切歌并播放
    li.addEventListener('click', ()=>{ captureFlip(li); i===cur ? togglePlay() : loadTrack(i, true); });
    listEl.appendChild(li);
    t.el = li;
    t.durEl = li.querySelector('.t-dur');
});
$('count').textContent = '共 ' + tracks.length + ' 首';

// 预加载每首歌的时长（只读 metadata，不下载整首歌）
tracks.forEach(t=>{
    const a = new Audio();
    a.preload = 'metadata';
    a.src = encodeURI(BASE + t.src);
    a.addEventListener('loadedmetadata', ()=>{ t.duration = a.duration; t.durEl.textContent = fmt(a.duration); });
});

// 更新高亮行
function updateActive(){
    tracks.forEach((t,i)=> t.el.classList.toggle('active', i===cur));
}

// FLIP 过渡：记录被点击卡片的封面位置，切换布局后让大封面从该位置放大到全屏
let flipFrom = null;
function captureFlip(card){
    if(!document.body.classList.contains('initial')) return;
    const img = card.querySelector('img');
    flipFrom = img ? img.getBoundingClientRect() : null;
}
function runFlip(){
    if(!flipFrom) return;
    const box = document.querySelector('.cover-box');
    const end = box.getBoundingClientRect();
    if(end.width && flipFrom.width){
        const sx = flipFrom.width / end.width;
        const dx = flipFrom.left - end.left;
        const dy = flipFrom.top - end.top;
        box.style.transition = 'none';
        box.style.transformOrigin = 'top left';
        box.style.transform = `translate(${dx}px, ${dy}px) scale(${sx})`;
        void box.offsetWidth; // 强制回流，确保起始状态生效
        box.style.transition = 'transform .8s cubic-bezier(.22,1,.36,1)';
        box.style.transform = '';
        setTimeout(()=>{ box.style.transition=''; box.style.transformOrigin=''; }, 850);
    }
    flipFrom = null;
}

// 更新播放/暂停按钮图标
function updatePlayIcon(){
    playIcon.innerHTML = playing
        ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'
        : '<path d="M8 5v14l11-7z"/>';
    document.body.classList.toggle('playing', playing);
    document.title = playing ? '▶ ' + tracks[cur].title + ' - ' + tracks[cur].artist : '我喜欢的音乐';
}

// 载入指定曲目
function loadTrack(i, autoplay){
    cur = i;
    const t = tracks[i];
    audio.src = encodeURI(BASE + t.src);
    coverImg.src = t.cover ? encodeURI(BASE + t.cover) : FALLBACK_COVER;
    // 背景同步切换为当前歌曲封面（配合 body.playing 显示高斯模糊）
    bgCurrent.style.backgroundImage = `url("${coverImg.src}")`;
    npTitle.textContent = t.title;
    npArtist.textContent = t.artist;
    prog.value = 0; prog.max = 100;
    curTime.textContent = '0:00';
    durTime.textContent = t.duration ? fmt(t.duration) : '--:--';
    fillRange(prog);
    updateActive();
    if(autoplay) play(); else updatePlayIcon();
}

function play(){
    audio.play().then(()=>{
        playing = true;
        updatePlayIcon();
        // 首次真正开始播放：从"全屏封面网格"切换为"播放器整屏"，并让封面从卡片位置放大
        if(document.body.classList.contains('initial')){
            document.body.classList.remove('initial');
            document.body.classList.add('started');
            runFlip();
        }
    }).catch(()=>{});
}
function pause(){
    audio.pause();
    playing = false;
    updatePlayIcon();
}
function togglePlay(){
    if(playing) pause();
    else{
        if(!audio.src) loadTrack(cur, true);
        else play();
    }
}

// 下一首（auto=true 表示由"播完自动切歌"触发）
function nextTrack(auto){
    if(shuffle && tracks.length>1){
        let n;
        do{ n = Math.floor(Math.random()*tracks.length); }while(n===cur);
        loadTrack(n, true);
        return;
    }
    if(cur < tracks.length-1){
        loadTrack(cur+1, true);
    }else{
        // 列表末尾：顺序播放模式则停在最后一首，否则回到开头继续
        if(auto && mode==='order'){ loadTrack(cur, false); }
        else loadTrack(0, true);
    }
}
function prevTrack(){
    loadTrack(cur>0 ? cur-1 : tracks.length-1, true);
}

// 播放结束：根据模式处理
audio.addEventListener('ended', ()=>{
    if(mode==='one'){
        audio.currentTime = 0;
        play();
    }else{
        nextTrack(true);
    }
});

// 进度更新
audio.addEventListener('loadedmetadata', ()=>{
    prog.max = audio.duration || 0;
    durTime.textContent = fmt(audio.duration);
});
audio.addEventListener('timeupdate', ()=>{
    if(seeking) return;
    prog.value = audio.currentTime;
    curTime.textContent = fmt(audio.currentTime);
    fillRange(prog);
});
prog.addEventListener('input', ()=>{
    seeking = true;
    curTime.textContent = fmt(+prog.value);
    fillRange(prog);
});
prog.addEventListener('change', ()=>{
    audio.currentTime = +prog.value;
    seeking = false;
});

// 音量
vol.addEventListener('input', ()=>{
    audio.volume = vol.value/100;
    audio.muted = false;
    fillRange(vol);
    updateVolIcon();
});
let lastVol = 80;
volBtn.addEventListener('click', ()=>{
    if(audio.muted || audio.volume===0){
        audio.muted = false;
        vol.value = lastVol || 80;
    }else{
        lastVol = vol.value;
        audio.muted = true;
        vol.value = 0;
    }
    audio.volume = vol.value/100;
    fillRange(vol);
    updateVolIcon();
});
function updateVolIcon(){
    const v = audio.muted ? 0 : +vol.value;
    volBtn.innerHTML = v===0
        ? '<path d="M16.5 12a4.5 4.5 0 0 0-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.9 8.9 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/>'
        : '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
}

// 控制按钮事件
playBtn.addEventListener('click', togglePlay);
nextBtn.addEventListener('click', ()=> nextTrack(false));
prevBtn.addEventListener('click', prevTrack);
shuffleBtn.addEventListener('click', ()=>{
    shuffle = !shuffle;
    shuffleBtn.classList.toggle('on', shuffle);
    shuffleBtn.classList.toggle('off', !shuffle);
});
// 循环切换：列表循环 → 单曲循环 → 顺序播放
repeatBtn.addEventListener('click', ()=>{
    mode = mode==='loop' ? 'one' : mode==='one' ? 'order' : 'loop';
    repeatBtn.classList.toggle('on', mode!=='order');
    repeatBtn.classList.toggle('off', mode==='order');
    repeatBadge.style.display = mode==='one' ? 'flex' : 'none';
});

// 键盘快捷键：空格播放/暂停，左右方向键快退快进
document.addEventListener('keydown', e=>{
    if(e.target.tagName==='INPUT') return;
    if(e.code==='Space'){
        e.preventDefault();
        togglePlay();
    }else if(e.code==='ArrowRight'){
        audio.currentTime = Math.min(audio.currentTime+5, audio.duration||0);
    }else if(e.code==='ArrowLeft'){
        audio.currentTime = Math.max(audio.currentTime-5, 0);
    }
});

// 初始状态
fillRange(vol);
updateVolIcon();

// 移动端抽屉菜单开关
const navToggle=document.getElementById('navToggle');
const navDrawer=document.getElementById('navDrawer');
const navMask=document.getElementById('navMask');
function setDrawer(open){
    navDrawer.classList.toggle('open',open);
    navMask.classList.toggle('show',open);
    navToggle.classList.toggle('open',open);
    document.body.style.overflow=open?'hidden':'';
}
navToggle.addEventListener('click',()=>setDrawer(!navDrawer.classList.contains('open')));
navMask.addEventListener('click',()=>setDrawer(false));
navDrawer.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>setDrawer(false)));
</script>
</body>
</html>
