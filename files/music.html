    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"微软雅黑",sans-serif}
        #head{position:fixed;top:0;left:0;width:100%;z-index:999;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.1);padding:8px 30px}
        #head ul{list-style:none;width:750px;display:flex;align-items:center;padding:0 10px}
        #head .logo-img{width:40px;vertical-align:middle}
        #head li{width:125px;text-align:center;font-size:16px;line-height:40px;white-space:nowrap}
        #head a{text-decoration:none;color:#666;display:inline-block;transition:transform .85s ease,color .3s ease}
        #head a.active{color:#000}
        #head a:hover{transform:scale(1.1);color:#000}
        @media (max-width:768px){
            #head{padding:10px 15px}
            #head ul{width:100%}
            #head li{width:auto;flex:1;font-size:12px;line-height:30px}
            #head .logo-img{width:30px}
            #head a:hover{transform:scale(1)}
        }
        body{background:#f7f7f7;padding:120px 20px 40px}
        .music-title{text-align:center;font-size:32px;color:#333;margin-bottom:40px;font-weight:700}
        .music-container{max-width:1400px;margin:0 auto;display:flex;flex-wrap:wrap;gap:25px;justify-content:center}
        .music-item{background:#fff;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.08);overflow:hidden;transition:.3s}
        .music-item:hover{transform:translateY(-5px);box-shadow:0 8px 20px rgba(0,0,0,.12)}
        @media (max-width:768px){
            .music-title{font-size:24px}
            .music-item{width:100%}
            iframe{width:100%!important}
        }
        .texta1{max-width:600px;margin:250px auto 10px;text-align:center;line-height:1.8;color:#444;font-size:11px}
        .texta1 img{width:25px;margin-left:6px;vertical-align:middle}
    </style>
